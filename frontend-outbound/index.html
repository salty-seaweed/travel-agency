<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self), payment=()">

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http://translate.google.com https://translate.google.com; img-src 'self' data: blob: http://localhost:8000 http://localhost:8001 http://localhost:8002 https:; connect-src 'self' http://localhost:8000 http://localhost:8001 http://localhost:8002 https: ws: wss:; media-src 'self' http://localhost:8000 http://localhost:8001 http://localhost:8002 https:;">

    <!-- Progressive Web App -->
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.json">

    <!-- SEO and Social -->
    <meta name="description" content="Thread Global Travels - Send locals abroad to world destinations. International travel packages and experiences.">
    <meta name="keywords" content="international travel, outbound tours, world destinations, global travel, Thread Global">
    <meta name="author" content="Thread Global Travels">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Thread Global Travels - Your World Awaits">
    <meta property="og:description" content="Discover amazing destinations around the world. International travel packages for Maldivian travelers.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1200&h=630&fit=crop">
    <meta property="og:url" content="https://local.threadtravels.com">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Thread Global Travels">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Thread Global Travels - Your World Awaits">
    <meta name="twitter:description" content="Discover amazing destinations around the world. International travel packages for Maldivian travelers.">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1200&h=630&fit=crop">

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://api.unsplash.com">

    <title>Thread Global Travels - Your World Awaits</title>
